name: "From Answers to Outcomes"
tagline: "A series on building specialist AI that does more than answer."
backbone: "Own → Route → Ground → Execute → Prove"
parts:
  - label: "Part 1"
    verb: "Own"
    question: "What context should the AI own?"
    title: "Your AI or Theirs?"
    blurb: "Domain knowledge, organization context, and user context, and why the organization's own context is the real differentiator."
    slug: your-ai-or-theirs
  - label: "Part 2"
    verb: "Route"
    question: "Which engine should handle each step?"
    title: "The Orchestrator"
    blurb: "Deciding, step by step, between a general LLM, a domain model, and a fixed procedure."
    slug: the-orchestrator
  - label: "Addendum"
    title: "When the Caller Is a Personal AI"
    blurb: "What changes when your users bring their own agent."
    slug: when-the-caller-is-a-personal-ai
  - label: "Part 3"
    verb: "Ground"
    question: "How do you know you retrieved the right thing?"
    title: "Getting It Right"
    blurb: "Finding the right content for this product, this version, and this user."
    slug: getting-it-right
  - label: "Part 4"
    verb: "Execute"
    question: "What knowledge should become deterministic behavior?"
    title: "From Knowing to Doing"
    blurb: "Turning how your experts work into behavior the AI can follow reliably."
    slug: from-knowing-to-doing
  - label: "Part 5"
    verb: "Prove"
    question: "How do you know it works, and change it without breaking it?"
    title: "Proving It and Keeping It Proven"
    blurb: "Evaluation, safe upgrades, and the feedback loop that makes it compound."
    slug: proving-it
