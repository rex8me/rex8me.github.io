name: "From Answers to Outcomes"
tagline: "Notes from building agentic AI for the enterprise, and where I think specialist AI is heading."
parts:
  - label: "Part 1"
    need: "It needs access to the right context."
    title: "Your AI or Theirs?"
    blurb: "What an enterprise AI has to own to make good decisions, and why most of that context was never public in the first place."
    slug: your-ai-or-theirs
  - label: "Part 2"
    need: "It needs to decide how each piece of work should be handled."
    title: "The Orchestrator"
    blurb: "Some steps are generic, some are deeply domain-specific, and some must follow a fixed procedure. Something has to tell them apart."
    slug: the-orchestrator
  - label: "Part 3"
    need: "It needs reliable information to reason over."
    title: "Getting It Right"
    blurb: "Retrieval that finds the right document for this product, this version and this user, not just a similar-looking one."
    slug: getting-it-right
  - label: "Part 4"
    need: "It needs a way to turn knowledge into action."
    title: "From Knowing to Doing"
    blurb: "Where expert know-how should become repeatable, deterministic behavior, and where the model should still be free to reason."
    slug: from-knowing-to-doing
  - label: "Part 5"
    need: "It needs evidence that the system continues to work."
    title: "Proving It and Keeping It Proven"
    blurb: "Evaluation that still means something after the models, prompts and procedures underneath it have changed."
    slug: proving-it
